# Every hour, replace this repository's tree, except .github/, with the one
# proofline.sh publishes at /.well-known/agent-skills/repository.json. The
# marketing site builds that file from the monorepo on each deployment, so a
# merged skill change reaches this repository within an hour of its deployment.
# The job writes with this repository's own token and holds no other credential.
name: Sync

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Replace the tree with the published one
        run: |
          curl --fail --silent --show-error --location --retry 3 --max-time 30 \
            --output "$RUNNER_TEMP/repository.json" \
            https://proofline.sh/.well-known/agent-skills/repository.json
          python3 - "$RUNNER_TEMP/repository.json" <<'PY'
          import json, shutil, sys
          from pathlib import Path, PurePosixPath

          files = json.loads(Path(sys.argv[1]).read_text())["files"]
          required = {".claude-plugin/marketplace.json", "plugins/proofline/.claude-plugin/plugin.json"}
          if not required <= files.keys():
              sys.exit("the published tree has no marketplace or plugin manifest")
          for path in files:
              parts = PurePosixPath(path).parts
              if PurePosixPath(path).is_absolute() or ".." in parts or parts[0] in (".git", ".github"):
                  sys.exit(f"the published tree names a path it may not write: {path}")
          for entry in Path(".").iterdir():
              if entry.name not in (".git", ".github"):
                  shutil.rmtree(entry) if entry.is_dir() else entry.unlink()
          for path, text in files.items():
              Path(path).parent.mkdir(parents=True, exist_ok=True)
              Path(path).write_text(text)
          PY
      - name: Commit a changed tree
        run: |
          git add --all
          if git diff --cached --quiet; then
            echo "The repository already matches proofline.sh."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet --message "Sync from https://proofline.sh"
          git push --quiet origin HEAD:main
