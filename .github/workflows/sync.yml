# The private release publisher owns updates through the scoped distribution App.
# This scheduled job detects drift; it never writes a branch or bypasses PR rules.
name: Verify published skills
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-published-skills
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Read the published tree
        run: |
          curl --fail --silent --show-error --location --retry 3 --max-time 30 \
            --output "$RUNNER_TEMP/repository.json" \
            https://proofline.sh/.well-known/agent-skills/repository.json
      - name: Validate the repository
        run: python3 .github/scripts/validate.py
      - name: Compare the published tree
        run: python3 .github/scripts/compare-published.py "$RUNNER_TEMP/repository.json"
