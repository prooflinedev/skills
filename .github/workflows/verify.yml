name: Verify published skills

on: workflow_dispatch

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare the checkout with the published skills
        run: |
          curl --fail --silent --show-error --retry 3 --max-time 30 \
            --output "$RUNNER_TEMP/repository.json" \
            https://proofline.sh/.well-known/agent-skills/repository.json
          python3 - "$RUNNER_TEMP/repository.json" <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path

          files = json.loads(Path(sys.argv[1]).read_bytes())["files"]
          tracked = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          managed = {p for p in tracked if p and p != "AGENTS.md" and not p.startswith(".github/")}
          if set(files) != managed:
              sys.exit("The published file list differs from the checkout.")
          for name in sorted(managed):
              path = Path(name)
              if path.resolve() != Path.cwd() / name or path.read_bytes() != files[name].encode():
                  sys.exit(f"The published file differs from the checkout: {name}")
          PY
